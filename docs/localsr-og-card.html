<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LocalSR link preview card</title>
<!-- Source of localsr/assets/og.png (1200 × 630). Render: see docs/localsr-social-card.md. -->
<style>
@font-face { font-family: "IBM Plex Sans"; src: url("../localsr/assets/fonts/IBMPlexSansVar-Roman.woff2") format("woff2"); font-weight: 100 700; }
html, body { margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; background: #161616; color: #ececec; font-family: "IBM Plex Sans", sans-serif; }
.card { box-sizing: border-box; width: 1200px; height: 630px; padding: 64px 64px 60px; display: grid; grid-template-columns: 560px 1fr; gap: 56px; }
.text { display: flex; flex-direction: column; }
.logo { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 600; }
h1 { margin: auto 0 0; font-size: 62px; line-height: 1.04; letter-spacing: -0.022em; font-weight: 600; }
p { margin: 24px 0 0; font-size: 24px; color: #a3a3a3; }
.frame { position: relative; margin: 14px; align-self: center; }
.frame > span { position: absolute; width: 26px; height: 26px; border: 0 solid #ece9df; }
.frame > span:nth-of-type(1) { left: -14px; top: -14px; border-left-width: 4px; border-top-width: 4px; }
.frame > span:nth-of-type(2) { right: -14px; top: -14px; border-right-width: 4px; border-top-width: 4px; }
.frame > span:nth-of-type(3) { left: -14px; bottom: -14px; border-left-width: 4px; border-bottom-width: 4px; }
.frame > span:nth-of-type(4) { right: -14px; bottom: -14px; border-right-width: 4px; border-bottom-width: 4px; }
.split { position: relative; width: 480px; height: 360px; overflow: hidden; }
.split img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.split .after { clip-path: inset(0 0 0 50%); }
.line { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: #fff; }
.tag { position: absolute; top: 14px; padding: 5px 11px; background: rgba(22,22,22,.86); font-size: 17px; border-radius: 2px; }
</style>
</head>
<body>
<div class="card">
  <div class="text">
    <div class="logo"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="#ece9df" stroke-width="2.6" d="M3.5 9.5v-6h6M14.5 3.5h6v6M20.5 14.5v6h-6M9.5 20.5h-6v-6"/><rect x="9.25" y="9.25" width="5.5" height="5.5" rx="1" fill="#e0603f"/></svg>LocalSR</div>
    <h1>Image and video restoration, on your computer.</h1>
    <p>Free for macOS, Windows and Linux.</p>
  </div>
  <div class="frame"><span></span><span></span><span></span><span></span>
    <div class="split">
      <img src="../localsr/assets/examples/butterfly-input.png" alt="">
      <img class="after" src="../localsr/assets/examples/butterfly-result.webp" alt="">
      <div class="line"></div>
      <span class="tag" style="left: 14px">Original</span><span class="tag" style="right: 14px">Best ×4</span>
    </div>
  </div>
</div>
</body>
</html>
